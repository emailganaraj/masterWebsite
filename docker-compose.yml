services:
  postgres:
    image: postgres:16-alpine
    container_name: masterwebsite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: masterwebsite
      POSTGRES_PASSWORD: masterwebsite_dev
      POSTGRES_DB: masterwebsite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masterwebsite -d masterwebsite"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: masterwebsite-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://masterwebsite:masterwebsite_dev@postgres:5432/masterwebsite
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-in-production-min-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-My Article Website}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-dev-revalidate-secret}
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: masterwebsite-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
